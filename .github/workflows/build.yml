name: Build Libin Smart Firmware (TL-WR845N v4)

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  SRC_REPO: https://github.com/lucktu/padavan_TW641.git
  SRC_COMMIT: 90f694db3b47f2dc9c2f072f1db17bf2b1d8102a
  TOOLCHAIN_URL: https://gitlab.com/api/v4/projects/hadzhioglu%2Fpadavan-ng/packages/generic/toolchain/latest/toolchain.tzst
  PRODUCT_ID: TL_WR845N-V4
  TEMPLATE: tplink/tl_wr845n-v4.config
  PATCH_FILE: patches/0001-libin-smart-firmware.patch
  MAX_FW_SIZE: 3932160   # 0x3C0000, the Firmware partition on this 4 MB board

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4

      - name: Get source (pinned commit)
        run: |
          git config --global --add safe.directory '*'
          git clone "$SRC_REPO" src
          git -C src checkout "$SRC_COMMIT"

      - name: Get toolchain
        run: wget -qO- "$TOOLCHAIN_URL" | tar -C src --zstd -xf -

      - name: Apply Libin patch
        run: |
          [ -f "$PATCH_FILE" ] || { echo "::error::$PATCH_FILE not found in the repo"; exit 1; }
          cd src
          echo "Applying ../$PATCH_FILE"
          git apply --whitespace=nowarn "../$PATCH_FILE"
          chmod +x trunk/user/scripts/wan_watchdog.sh trunk/user/scripts/speedctl.sh

      - name: Configure (English only, Speed Control on, IPSet off)
        run: |
          C=src/trunk/.config
          cp "src/trunk/configs/templates/$TEMPLATE" "$C"
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_LANG_RU=y/#CONFIG_FIRMWARE_INCLUDE_LANG_RU=y/' "$C"
          # Speed Control needs traffic control (tc + HTB); IPSet is dropped to make room in 4 MB flash
          sed -i 's/^#CONFIG_FIRMWARE_INCLUDE_QOS=y/CONFIG_FIRMWARE_INCLUDE_QOS=y/' "$C"
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_IPSET=y/#CONFIG_FIRMWARE_INCLUDE_IPSET=y/' "$C"
          grep -q '^CONFIG_FIRMWARE_INCLUDE_QOS=y' "$C" || { echo "QoS not enabled"; exit 1; }
          grep -E "PRODUCT_ID|LANG_RU|INCLUDE_QOS|INCLUDE_IPSET" "$C"

      - name: Build firmware (auto-trim until it fits 4 MB flash)
        run: |
          cd src/trunk
          C=.config
          off() { sed -i "s/^$1=y/#$1=y/" "$C"; }
          trims=(
            ""
            "CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE"
            "CONFIG_FIRMWARE_INCLUDE_DROPBEAR"
            "CONFIG_FIRMWARE_ENABLE_IPV6"
          )
          names=("full" "no Software Offload (SFE)" "no SSH server (web Console still works)" "no IPv6")
          dropped=""
          for i in "${!trims[@]}"; do
            for opt in ${trims[$i]}; do off "$opt"; done
            [ $i -gt 0 ] && dropped="${dropped:+$dropped, }${names[$i]}"
            echo "=== Build attempt $((i+1)): ${dropped:-full feature set} ==="
            ./clear_tree.sh >/dev/null 2>&1 || true
            ./build_firmware.sh
            FW="$(find images -type f -iname '*.bin' -printf '%T@\t%p\n' | sort -n | tail -1 | cut -f2)"
            [ -n "$FW" ] || { echo "::error::Firmware file not found"; exit 1; }
            size=$(stat -c %s "$FW")
            if [ "$size" -le "$MAX_FW_SIZE" ]; then
              echo "::notice::Firmware fits: $size of $MAX_FW_SIZE bytes ($(( (MAX_FW_SIZE - size) / 1024 )) KB free). Removed: ${dropped:-nothing}"
              echo "### Firmware: $size / $MAX_FW_SIZE bytes. Removed: ${dropped:-nothing}" >> "$GITHUB_STEP_SUMMARY"
              cp "$FW" "$GITHUB_WORKSPACE/Libin_WR845Nv4_v2.bin"
              echo "Removed to fit 4 MB flash: ${dropped:-nothing}" > "$GITHUB_WORKSPACE/BUILD_INFO.txt"
              exit 0
            fi
            echo "::warning::Attempt $((i+1)) too big: $size of $MAX_FW_SIZE bytes ($(( (size - MAX_FW_SIZE) / 1024 )) KB over)"
          done
          echo "::error::Still too big after all trims: $size of $MAX_FW_SIZE bytes"
          exit 1

      - name: Check Speed Control is inside the image
        run: |
          R=src/trunk/romfs
          for f in usr/bin/speedctl usr/bin/wan_watchdog.sh bin/tc www/Advanced_SpeedControl_Content.asp; do
            [ -e "$R/$f" ] && echo "OK  /$f" || echo "::warning::MISSING /$f in image"
          done

      - name: Check size
        run: |
          size=$(stat -c %s Libin_WR845Nv4_v2.bin)
          echo "Firmware size: $size bytes (max $MAX_FW_SIZE)"
          if [ "$size" -gt "$MAX_FW_SIZE" ]; then
            echo "::error::Firmware is too big for the 4 MB flash"; exit 1
          fi
          sha256sum Libin_WR845Nv4_v2.bin > SHA256SUMS.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Libin-WR845Nv4-v2
          retention-days: 30
          path: |
            Libin_WR845Nv4_v2.bin
            SHA256SUMS.txt
            BUILD_INFO.txt
